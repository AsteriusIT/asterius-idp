[workspace]
resolver = "3"
# cargo-fuzz builds with its own flags on nightly; keeping it out of the
# workspace keeps that out of every ordinary build.
exclude = ["fuzz"]
members = [
    "crates/domain",
    "crates/oidc",
    "crates/jose",
    "crates/store-pg",
    "crates/web",
    "crates/webauthn",
    "crates/admin-api",
    "crates/server",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/AsteriusIT/asterius-idp"
authors = ["Asterius contributors"]
publish = false

[workspace.dependencies]
# --- internal crates -------------------------------------------------------
asterius-domain = { path = "crates/domain" }
asterius-oidc = { path = "crates/oidc" }
asterius-jose = { path = "crates/jose" }
asterius-store-pg = { path = "crates/store-pg" }
asterius-web = { path = "crates/web" }
asterius-webauthn = { path = "crates/webauthn" }
asterius-admin-api = { path = "crates/admin-api" }

# --- pure / protocol-safe --------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
askama = { version = "0.16", default-features = false, features = ["std", "derive"] }
argon2 = { version = "0.5", features = ["std"] }
unicode-normalization = "0.1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
async-trait = "0.1"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
# CBOR, for the WebAuthn attestation object and COSE keys (ast-2vk.3).
# Pure Rust and no crypto: it decodes a byte string, which is exactly the
# part ADR-0004 says we may take from a library.
ciborium = "0.2"
base64 = "0.22"
aws-lc-rs = "1"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.9"
serde_path_to_error = "0.1"
getrandom = "0.3"
subtle = "2.6"

# --- test-only -------------------------------------------------------------
# `default-features = false` drops proptest's `fork` and `timeout` features,
# which pull in a process-spawning harness the property tests here do not use.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

# --- adapters only ---------------------------------------------------------
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "form", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "time", "uuid", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "timeout", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Client-certificate chain building for RFC 8705 §2.1 (`ast-m9c.3`). Already in
# the tree under rustls; taken as a direct dependency because validating a
# *client* chain against a tenant's own anchors happens after the handshake,
# where rustls has no API. `default-features = false` drops its bundled `ring`
# backend: the signature algorithms are passed in from the one crypto provider
# this build has, aws-lc-rs (ADR-0004).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio"] }
ipnet = { version = "2", features = ["serde"] }
http-body-util = "0.1"
# Trust anchors for the one outbound TLS client (client `jwks_uri` fetches).
# The Mozilla root programme, compiled in: a scratch container has no
# platform store, and CDLA-Permissive-2.0 is already on the licence
# allow-list in deny.toml.
webpki-roots = "1"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Fast, predictable test/dev builds: the workspace is large and protocol work
# is compile-loop bound, so we trade a little runtime speed for link speed.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
