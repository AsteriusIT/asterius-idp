[package]
name = "asterius-admin-api"
description = "First-party, same-origin admin API and console asset serving."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
image.workspace = true
hex.workspace = true
sha2.workspace = true
askama.workspace = true
asterius-domain.workspace = true
# The policy test bench takes Authorization API 1.0 §6.1's request and answers
# §6.2's response (`ast-f7m.9`), and `asterius_oidc::authzen` is where that
# wire format is parsed and rendered for the PDP endpoints. Reading it here
# rather than re-spelling it is the point: a bench that accepted a second
# dialect of the request would debug a rule against a shape no relying party
# sends. A protocol crate, like `asterius-ssf` above — it reaches no adapter.
asterius-oidc.workspace = true
# The Shared Signals screen names a stream, a stream status and a
# verification `state` (`ast-f7m.8`): protocol types, from the protocol crate,
# which reaches no adapter.
asterius-ssf.workspace = true
# The console's entry document is HTML, and `asterius_web::Document` is the one
# type in the workspace that produces it: it cannot be built without the
# per-response CSP nonce, which is exactly the guarantee ADR-0009 asks of the
# console shell.
asterius-web.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio.workspace = true
http-body-util.workspace = true
tower.workspace = true
