[package]
name = "asterius-jose"
description = "Key management and JOSE adapter: implements the domain KeyStore/Signer ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
asterius-domain.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
zeroize.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
# The shared fetch backoff (`ast-mxc.8`) is best-effort: a store that cannot be
# reached must not stop a client authenticating, so the failure is a log line
# rather than an error. That is the only thing logged from this crate.
tracing.workspace = true
# RFC 9449 §4.3 asks a server to compare `htu` after RFC 3986 §6.2.2/§6.2.3
# normalisation. That comparison is a security boundary — see
# `dpop::NormalisedUri` — and hand-rolling a URI parser to reach it would be
# the wrong kind of self-reliance. This is a parser, not an adapter: it opens
# no socket, and `scripts/check-layering.sh` still holds.
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
