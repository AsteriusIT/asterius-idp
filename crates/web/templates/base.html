{# The one layout. Every page extends it, so the head is written once and the
   nonce cannot be forgotten on a page that needs it.

   No page here has a <script> tag. Every page works with JavaScript disabled,
   which is a requirement of ast-2vk.1 and also the simplest way to keep
   `script-src 'nonce-…' 'strict-dynamic'` honest: a policy that permits
   nothing to run is one nothing can bypass.

   One template is exempt, by name and with a reason, in
   `crates/web/src/source_audit.rs`: passkey.html, because
   `navigator.credentials.create()` is a JavaScript API and no markup can run a
   WebAuthn ceremony. Its script is inline under this page's nonce, and the
   page still works — through the password path — for a browser that ignores
   it. Anything else with a <script> in it fails the build. #}
<!DOCTYPE html>
<html lang="{{ text.lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{# `no-referrer` is also sent as a header. It is repeated here because a page
   saved and reopened from disk keeps the meta and loses the header, and an
   authorization page in someone's Downloads folder should still not leak. #}
<meta name="referrer" content="no-referrer">
<title>{% block title %}{{ tenant_name }}{% endblock %}</title>
{# One <style> element, one nonce. The tenant's design tokens are appended to
   it — after the defaults, so they win on document order — and they are
   rendered *escaped*, like any other value: `asterius_web::theme` emits only
   characters the escaper leaves alone, so a token that ever carried markup
   would come out broken rather than injected. That is why there is still
   exactly one `|safe` in this tree. -#}
{# The face this deployment serves itself, declared here rather than in
   style.css because its URL is the only thing in the stylesheet that is not a
   constant: it carries a hash of the bytes (`asterius_web::brand::font_path`)
   and this request's mount prefix, so `/t/{tenant}/…` resolves (`ast-295`).

   The URL is rendered *escaped*, like everything else: a path built from a
   digest and a tenant id — `a-z`, `0-9`, `-` and `_` — contains none of the
   five characters the escaper rewrites, so the bytes are the same either way.
   `format("woff2")` keeps a browser that cannot read WOFF2 from downloading
   93 KB to find out, and `swap` means the page is readable in the system
   stack from the first paint and never blank. -#}
<style {{ nonce_attribute|safe }}>@font-face{font-family:Geist;src:url("{{ brand.font_url() }}") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
{% include "style.css" %}{{ theme_css }}</style>
</head>
<body>
{# The layout of ast-9li's direction A: a centred card on a neutral backdrop,
   with the tenant's mark and name above it. The name is the page's `h1`
   because it is who is asking; each page's own subject is the `h2` inside the
   card.

   The mark is the tenant's uploaded logo when it has one, and otherwise one of
   the twenty-four icons `asterius_web::brand` compiles in. The icon is inline
   SVG and therefore rendered *unescaped* — the second and last `|safe` in this
   tree, exempted by its exact spelling in `crates/web/src/source_audit.rs`.
   That is only sound because `Brand::icon_svg` has no string input: it takes
   an `asterius_domain::TenantIcon`, an enumeration, and returns one of
   twenty-four reviewed drawings. A tenant supplies the *name* of a mark, never
   the mark. `no_free_string_can_reach_the_rendered_mark` is the proof.

   Both marks are decorative: the tenant's name is beside them in text, and a
   screen reader that announced the logo too would say it twice. Hence
   `alt=""` and `aria-hidden`. #}
<div class="page">
<div class="shell">
<div class="brand">
{% if brand.logo_url().is_empty() %}<span class="brand-mark">{{ brand.icon_svg()|safe }}</span>
{% else %}<span class="brand-mark brand-logo"><img src="{{ brand.logo_url() }}" alt=""></span>
{% endif %}
<h1 class="wordmark">{{ tenant_name }}</h1>
</div>
<main class="card{% block card_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</div>
</div>
</body>
</html>
