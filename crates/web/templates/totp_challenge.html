{% extends "base.html" %}
{% block title %}{{ text.login_totp_title() }} — {{ tenant_name }}{% endblock %}
{% block content %}
{% include "error_summary.html" %}
<h2>{{ text.login_totp_title() }}</h2>
<p>{{ text.login_totp_explanation() }}</p>
<form class="password-form" method="post" action="{{ action }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>
  <span>{{ text.login_totp_code() }}</span>
  <input type="text" name="totp_code" inputmode="numeric" autocomplete="one-time-code"
         pattern="[0-9]{6}" maxlength="6" autofocus required>
</label>
<div class="actions"><button type="submit">{{ text.login_totp_submit() }}</button></div>
</form>
{% if step_up %}
<form method="post" action="{{ action }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="actions"><button class="secondary" type="submit" name="decision" value="cancel">{{ text.step_up_cancel() }}</button></div>
</form>
{% endif %}
{% endblock %}
