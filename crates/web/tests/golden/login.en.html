
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">
<title>Sign in — Example Tenant</title>
<style nonce="snapshot-nonce">/* The defaults. A tenant's design tokens are appended to this same <style>
   element as one more :root rule, so they win on document order. */
:root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #555; --line: #ccc;
        --accent: #2f6fdb; --accent-fg: #fff; --danger: #c0392b;
        --radius: 4px; --space: 8px;
        --font: system-ui, -apple-system, Segoe UI, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #eee; --bg: #16181c; --muted: #aaa; --line: #444; }
}
body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
       font: 16px/1.5 var(--font); }
main { max-width: 26rem; margin: 0 auto; }
h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.5rem; }
h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .75rem; }
label { display: block; margin: 0 0 1rem; }
label span { display: block; margin-bottom: .25rem; }
input[type=text], input[type=password], input[type=email] {
  width: 100%; box-sizing: border-box; padding: .5rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--fg); font: inherit;
}
button { padding: .55rem 1rem; border: 0; border-radius: var(--radius); font: inherit;
         cursor: pointer; background: var(--accent); color: var(--accent-fg); }
button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.actions { display: flex; gap: var(--space); margin-top: 1.5rem; }
.scopes { margin: 0 0 1.5rem; padding-left: 1.25rem; }
.muted { color: var(--muted); font-size: .875rem; }
.error { border-left: 3px solid var(--danger); padding-left: .75rem; margin-bottom: 1.5rem; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .875rem; }
label.inline { display: inline; margin: 0; }
label.inline span { display: inline; }
/* A one-time code is read off one screen and typed into another, so it is set
   wide and monospaced: the characters that get confused doing that are 0/O and
   1/l, and a proportional face is where they look alike. */
input.code { letter-spacing: .15em; text-transform: uppercase;
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.code-display { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 1.5rem; letter-spacing: .15em; margin: 0 0 1rem; }
/* A link that acts as the page's one forward step. It is a link and not a
   button because it navigates; this only makes it look like the rest. */
a.button { display: inline-block; text-decoration: none; padding: .55rem 1rem;
           border-radius: var(--radius); background: var(--accent); color: var(--accent-fg); }
/* SC 2.4.7: the error summary takes the focus after a failed submission, and a
   focused element a user cannot see is a focus indicator that is not there. */
[tabindex="-1"]:focus { outline: 2px solid var(--danger); outline-offset: 4px; }
.error p { margin: 0 0 .25rem; }:root{--bg:#ffffff;--fg:#111111;--muted:#555555;--line:#555555;--accent:#2f6fdb;--accent-fg:#ffffff;--danger:#c0392b;--radius:4px;--space:8px;--font:system-ui, -apple-system, Segoe UI, sans-serif;}</style>
</head>
<body>
<main>
<h1>Example Tenant</h1>





<div class="error" role="alert" tabindex="-1" autofocus>
<p><strong>There is a problem</strong></p>
<p>That username and password did not match.</p>
</div>


<div id="passkey-signin"
     data-options-url="/interaction/abc/passkeys/options"
     data-finish-url="/interaction/abc/passkeys/finish"
     data-next-url="/interaction/abc/login"
     data-csrf="snapshot-csrf"
     data-working="Follow your device&#39;s prompt to sign in."
     data-failed="That did not work. Sign in with your password instead."
     hidden>
  <div class="actions"><button type="button" id="passkey-signin-button">Sign in with a passkey</button></div>
  <p class="muted" id="passkey-signin-status"></p>
</div>

<form method="post" action="/interaction/abc/login">

<input type="hidden" name="csrf" value="snapshot-csrf">
<label>
  <span>Username</span>
  
  <input type="text" name="username" id="username" autocomplete="username webauthn"
         autocapitalize="none"
         
         spellcheck="false" required value="ada@example.test">
</label>
<label>
  <span>Password</span>
  <input type="password" name="password" autocomplete="current-password" required>
</label>
<div class="actions"><button type="submit">Sign in</button></div>
</form>

<noscript>

<p class="muted">Signing in with a passkey needs JavaScript, because it is a browser API that a page has to call. JavaScript is switched off here, so use your username and password.</p>
</noscript>

<script nonce="snapshot-nonce">
(() => {
  "use strict";
  const root = document.getElementById("passkey-signin");
  const status = document.getElementById("passkey-signin-status");
  const button = document.getElementById("passkey-signin-button");
  if (!root || !status || !button) {
    return;
  }
  const say = (text) => {
    status.textContent = text;
  };
  if (!window.PublicKeyCredential || !navigator.credentials) {
    return;
  }

  const decode = (value) => {
    const padded = value.replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(padded + "===".slice((padded.length + 3) % 4));
    const bytes = new Uint8Array(raw.length);
    for (let index = 0; index < raw.length; index += 1) {
      bytes[index] = raw.charCodeAt(index);
    }
    return bytes;
  };
  const encode = (buffer) => {
    let raw = "";
    for (const byte of new Uint8Array(buffer)) {
      raw += String.fromCharCode(byte);
    }
    return btoa(raw).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  };

  const post = async (url, body) => {
    const answer = await fetch(url, {
      method: "POST",
      credentials: "same-origin",
      cache: "no-store",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!answer.ok) {
      throw new Error("the server refused the ceremony: " + answer.status);
    }
    return answer.status === 204 ? null : answer.json();
  };

  // One ceremony at a time. A challenge is single-use and the newest one
  // replaces whatever was outstanding, so an autofill ceremony still waiting
  // when the button is pressed would be signing over a challenge the server
  // has already thrown away.
  let pending = null;

  const authenticate = async (mediation) => {
    if (pending) {
      pending.abort();
    }
    const ceremony = new AbortController();
    pending = ceremony;
    const options = await post(root.dataset.optionsUrl, { csrf: root.dataset.csrf });
    // Aborting reaches a ceremony that is waiting in `credentials.get`, and
    // nothing else: one still fetching its options is never told. It has to
    // notice by itself, or it signs a challenge that has since been replaced
    // and posts it — which spends the challenge the ceremony that superseded
    // it is about to use, so the sign-in the user actually asked for is
    // refused. That is a click landing inside the autofill ceremony's options
    // request, and it is what it looks like from the outside: pressing the
    // button too soon says "that did not work".
    if (pending !== ceremony) {
      return;
    }
    options.challenge = decode(options.challenge);
    const assertion = await navigator.credentials.get({
      publicKey: options,
      mediation: mediation,
      signal: ceremony.signal,
    });
    // The same question again, because the window reopens across the ceremony
    // itself: an assertion that arrives after a newer one has drawn its
    // challenge is as stale as one signed before it.
    if (!assertion || pending !== ceremony) {
      return;
    }
    await post(root.dataset.finishUrl, {
      csrf: root.dataset.csrf,
      type: assertion.type,
      rawId: encode(assertion.rawId),
      clientDataJSON: encode(assertion.response.clientDataJSON),
      authenticatorData: encode(assertion.response.authenticatorData),
      signature: encode(assertion.response.signature),
      userHandle: assertion.response.userHandle ? encode(assertion.response.userHandle) : null,
    });
    window.location.assign(root.dataset.nextUrl);
  };

  button.addEventListener("click", () => {
    button.disabled = true;
    say(root.dataset.working);
    authenticate("optional").catch(() => {
      button.disabled = false;
      say(root.dataset.failed);
    });
  });
  root.hidden = false;

  // The enhancement, and only when the browser says it can: an aborted or
  // unsupported autofill must leave the button and the password form exactly
  // as they were.
  if (typeof PublicKeyCredential.isConditionalMediationAvailable === "function") {
    PublicKeyCredential.isConditionalMediationAvailable()
      .then((available) => (available ? authenticate("conditional") : null))
      .catch(() => null);
  }
})();
</script>

</main>
</body>
</html>
