[package]
name = "asterius-oidc"
description = "OpenID Connect / OAuth 2.0 protocol logic. Pure functions over domain types; no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
asterius-domain.workspace = true
time.workspace = true
# RFC 7636 §4.2's S256 transformation is a SHA-256 and a base64url encode.
# Neither is cryptography this crate could get wrong quietly, and keeping the
# transformation next to the clause it implements is worth more than routing a
# hash through an adapter port.
base64.workspace = true
# `JwtId::generate` draws 128 bits for the `jti` of every access token
# (RFC 9068 §2.2, FAPI 2.0 SP §5.4.1 item 4). The same argument `sha2` gets
# above: the entropy floor is the requirement, and a token minted through an
# adapter port would put the one line that has to be right somewhere else.
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
proptest.workspace = true
