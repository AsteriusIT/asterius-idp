[package]
name = "asterius-store-pg"
description = "PostgreSQL adapters (sqlx) implementing the domain repository ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2.workspace = true
asterius-domain.workspace = true
hex.workspace = true
# The key repository generates, seals and unseals signing keys. Cryptography
# lives in one adapter (ADR-0004), so this one calls it rather than growing a
# second copy.
asterius-jose.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The key tests rebuild a verifying key from a published JWK, the way a relying
# party would: base64url is the only decoding that takes.
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The previous-KEK tests implement `Kek` to count what the fallback asks for,
# and the trait's `unwrap` hands back a `Zeroizing<Vec<u8>>`.
zeroize.workspace = true
# The theme tests compute an asset's digest the way the upload adapter does,
# over the bytes they are about to store.
sha2.workspace = true
