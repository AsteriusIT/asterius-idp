[package]
name = "asterius-ssf"
description = "Shared Signals Framework: Security Event Token issuance (SSF 1.0 §3–§4, RFC 8417, RFC 9493)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
asterius-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true
# `CredentialChange::fido2_aaguid` renders an authenticator AAGUID, which the
# WebAuthn path holds as a `Uuid`; taking the type keeps the hyphenated
# rendering in one place.
uuid.workspace = true
# `SetId::generate` and `Txn::generate` each draw 128 bits. The same argument
# the `jti` of an access token gets in `asterius_oidc::tokens`: the entropy
# floor is the requirement, and drawing it through a port would put the one
# line that has to be right somewhere else.
getrandom.workspace = true
base64.workspace = true

[dev-dependencies]
# The signing path under test is the production one: `LocalKeyStore`
# implements both `KeyStore` and `Signer`, so a test signs with the tenant's
# active key and verifies against the tenant's published JWKS.
asterius-jose.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest.workspace = true
# An independent JOSE implementation, so "the SET verifies" is not this
# workspace agreeing with itself: jsonwebtoken parses the JOSE header, reads
# the published JWK and applies `iss`/`aud` itself, none of it our code.
#
# The backend is `aws_lc_rs` and not `rust_crypto` because `rust_crypto` pulls
# the `rsa` crate unconditionally — RUSTSEC-2023-0071, the Marvin timing
# attack, with no fixed version — even though a SET is only ever EdDSA or
# ES256 (ADR-0003) and no RSA code would run. cargo-deny does not distinguish
# a dev-dependency, and an advisory exception on a FAPI server is a worse
# trade than the one made here (ast-l4n, docs/threat-model.md).
#
# What that costs: the verifier now shares aws-lc-rs with `asterius-jose`, so
# this test no longer covers the signature primitives themselves. It still
# covers everything above them — signing input, base64url, `typ`, `kid`, JWKS
# publication, claim validation — which is where an interop bug in a SET
# profile actually lives.
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
