apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: asterius-playground
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: asterius-playground
    spec:
      serviceAccountName: playground-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: asterius-playground-gateway:20261008
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: gateway-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: portal
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        - name: portal
          mountPath: /usr/share/nginx/html/style.css
          subPath: style.css
          readOnly: true
        - name: setup
          mountPath: /usr/share/nginx/html/playground/setup
          readOnly: true
        command:
        - nginx
        args:
        - -g
        - daemon off;
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
      - name: gateway-config
        configMap:
          name: playground-gateway
      - name: portal
        configMap:
          name: playground-portal
      - name: setup
        configMap:
          name: playground-setup
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: asterius-playground
spec:
  selector:
    app: gateway
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground-setup
  namespace: asterius-playground
  labels:
    app.kubernetes.io/part-of: asterius-playground
spec:
  ingressClassName: nginx
  rules:
  - host: desktop-cpbptqn-1.tailacbb15.ts.net
    http:
      paths:
      - path: /playground/setup
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 80
