apiVersion: v1
kind: Namespace
metadata:
  name: asterius-playground
  labels:
    app.kubernetes.io/part-of: asterius-playground
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: playground-budget
  namespace: asterius-playground
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '4'
    limits.memory: 2Gi
    pods: '12'
    services: '8'
    secrets: '10'
    configmaps: '10'
    persistentvolumeclaims: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: playground-defaults
  namespace: asterius-playground
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    default:
      cpu: 500m
      memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-app
  namespace: asterius-playground
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playground-reader
  namespace: asterius-playground
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: playground-reader
  namespace: asterius-playground
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - services
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: playground-reader
  namespace: asterius-playground
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: playground-reader
subjects:
- kind: ServiceAccount
  name: playground-reader
  namespace: asterius-playground
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: practice-resource
  namespace: asterius-playground
data:
  purpose: Read this owned sandbox resource; playground-reader may inspect it but
    cannot change it or read Secrets.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: playground-connection
  namespace: asterius-playground
data:
  ISSUER: https://desktop-cpbptqn-1.tailacbb15.ts.net/t/demo
  OIDC_INTERNAL_ISSUER: http://asterius.asterius.svc.cluster.local:9443/t/demo
  PLAYGROUND_ORIGIN: https://desktop-cpbptqn-1.tailacbb15.ts.net:8446
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-a
  namespace: asterius-playground
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-a
  template:
    metadata:
      labels:
        app: demo-a
        app.kubernetes.io/part-of: asterius-playground
    spec:
      serviceAccountName: playground-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: demo-a
        image: asterius-playground-sso:ast-qzw6-20261008
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /demo-a/healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /demo-a/healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
        env:
        - name: ISSUER
          valueFrom:
            configMapKeyRef:
              name: playground-connection
              key: ISSUER
        - name: OIDC_INTERNAL_ISSUER
          valueFrom:
            configMapKeyRef:
              name: playground-connection
              key: OIDC_INTERNAL_ISSUER
        - name: PORT
          value: '8080'
        - name: CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: demo-a-oidc
              key: CLIENT_ID
        - name: CLIENT_PRIVATE_KEY_JWK_FILE
          value: /run/oidc/CLIENT_PRIVATE_KEY_JWK
        - name: CLIENT_KEY_ID
          valueFrom:
            secretKeyRef:
              name: demo-a-oidc
              key: CLIENT_KEY_ID
        - name: EXTERNAL_URL
          value: https://desktop-cpbptqn-1.tailacbb15.ts.net:8446/demo-a
        - name: APP_NAME
          value: Asterius Demo A
        - name: COOKIE_NAME
          value: asterius_playground_demo_a
        volumeMounts:
        - name: oidc
          mountPath: /run/oidc
          readOnly: true
      volumes:
      - name: oidc
        secret:
          secretName: demo-a-oidc
          defaultMode: 288
          items:
          - key: CLIENT_PRIVATE_KEY_JWK
            path: CLIENT_PRIVATE_KEY_JWK
---
apiVersion: v1
kind: Service
metadata:
  name: demo-a
  namespace: asterius-playground
spec:
  selector:
    app: demo-a
  ports:
  - name: http
    port: 80
    targetPort: http
---
