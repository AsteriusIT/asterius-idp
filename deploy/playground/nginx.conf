pid /tmp/nginx.pid;
events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        location = /playground/setup { return 308 /playground/setup/; }
        location /playground/setup/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }
        location = /healthz { return 200 "ok\n"; }
        location = / { root /usr/share/nginx/html; try_files /index.html =404; }
        location = /style.css { root /usr/share/nginx/html; }
        location = /demo-a { return 308 /demo-a/; }
        location /demo-a/ { proxy_pass http://demo-a; proxy_set_header Cookie "asterius_playground_demo_a=$cookie_asterius_playground_demo_a; asterius_playground_demo_a_login=$cookie_asterius_playground_demo_a_login"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
        location = /demo-b { return 308 /demo-b/; }
        location /demo-b/ { proxy_pass http://demo-b; proxy_set_header Cookie "asterius_playground_demo_b=$cookie_asterius_playground_demo_b; asterius_playground_demo_b_login=$cookie_asterius_playground_demo_b_login"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
        location = /financial { return 308 /financial/; }
        location /financial/ { proxy_pass http://financial-web; proxy_set_header Cookie ""; proxy_set_header Host $http_host; }
        location = /financial-api { return 308 /financial-api/; }
        location /financial-api/ { proxy_pass http://financial-api/; proxy_set_header Cookie "asterius_playground_financial=$cookie_asterius_playground_financial; asterius_playground_financial_login=$cookie_asterius_playground_financial_login"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
        location = /protocols { return 308 /protocols/; }
        location /protocols/ { proxy_pass http://protocol-lab/; proxy_set_header Cookie "asterius_protocol_lab=$cookie_asterius_protocol_lab"; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto https; }
        location / { return 404; }
    }
}
