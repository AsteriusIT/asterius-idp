# Configuration for the example compose stack. NOT a production configuration.
#
# One deliberate difference from a real deployment: `mode = "behind_proxy"` with
# nothing actually in front, so the stack speaks plain HTTP on the loopback and
# the smoke test can reach it without a certificate. A real deployment either
# terminates TLS in this process (`mode = "terminate_tls"` plus `[server.tls]`)
# or puts a reverse proxy in front and lists it in `[server.proxy]`. FAPI 2.0 SP
# §5.2 requires TLS on every endpoint — see deploy/README.md.
#
# Every key is described, with its type and default, in docs/configuration.md.

log_format = "json"

[server]
bind = "0.0.0.0:9443"
mode = "behind_proxy"

[server.proxy]
# Nothing but the compose network reaches this container, and the smoke test
# arrives through the published loopback port. 172.16/12 is the range Docker
# hands its default bridge networks.
trusted_cidrs = ["127.0.0.0/8", "::1/128", "172.16.0.0/12"]

[keys]
# Development only. The key sits in the compose file in plaintext, which is
# precisely what production must not do: see "Secret sources" in
# docs/configuration.md, where the production shape is `kek_file` mounted from
# a secret store.
kek_env = "ASTERIUS_KEK"

[database]
url = "postgres://asterius:asterius@db:5432/asterius"
max_connections = 8

[features]
# Everything off is the FAPI 2.0 baseline. Switch one on and it appears both in
# the discovery document and on /readyz.

# The issuer must be https even here (RFC 8414 §2): it is an identifier, not a
# fetch target, and the smoke test reaches the same server over plain HTTP with
# a matching `Host` header. Point a TLS terminator at :9443 and this becomes
# true rather than merely well-formed.
[[tenant]]
id = "demo"
issuer = "https://localhost:9443/t/demo"
