# Configuration for the example compose stack. NOT a production configuration.
#
# TLS is terminated by the nginx in front (`mode = "behind_proxy"`), with a
# self-signed certificate generated at first start into deploy/certs/. That is
# the shape docs/deployment/tls-and-proxy.md describes; the only development
# thing about it is the certificate, which nobody should be asked to trust.
# The alternative shape is `mode = "terminate_tls"` plus `[server.tls]`, with
# the process owning the listener.
#
# Every key is described, with its type and default, in docs/configuration.md.

log_format = "json"

[server]
bind = "0.0.0.0:9443"
mode = "behind_proxy"

[server.proxy]
# The single trust switch of the whole proxy setup (tls-and-proxy.md §1): a
# peer inside this list may assert the client's address, the client's host and
# the client's certificate. It is exactly the compose network declared with a
# fixed subnet in docker-compose.yml — not 172.16/12, which is every bridge
# network Docker might ever create on this host, and not the loopback, which
# nothing reaches now that the cleartext port is unpublished.
trusted_cidrs = ["172.28.0.0/16"]

[keys]
# Development only. The key sits in the compose file in plaintext, which is
# precisely what production must not do: see "Secret sources" in
# docs/configuration.md, where the production shape is `kek_file` mounted from
# a secret store.
kek_env = "ASTERIUS_KEK"

[database]
url = "postgres://asterius:asterius@db:5432/asterius"
max_connections = 8

[features]
# Everything off is the FAPI 2.0 baseline. Switch one on and it appears both in
# the discovery document and on /readyz.

# The issuer's authority is what clients read out of the discovery document,
# so it must be the public name nginx answers on — `localhost`, port 443 and
# therefore no port in the URL. Publish nginx on another port, or set
# ASTERIUS_TLS_HOST to another name, and both issuers here have to follow
# (tls-and-proxy.md §3).
[[tenant]]
id = "demo"
issuer = "https://localhost/t/demo"

# The deployment admin (ADR-0010): a user of the reserved tenant `admin`,
# holding a deployment-scoped role. Without this table `docker compose up`
# gives a working tenant and nobody who can administer it.
#
# The password is NOT in this file and NOT in the image. `password_env` names a
# variable the compose file requires the operator to export, so the stack fails
# with "set ASTERIUS_ADMIN_PASSWORD" rather than starting with a credential
# every copy of this repository shares. Production mounts a file instead
# (`password_file`); see "Secret sources" in docs/configuration.md.
[admin]
tenant = "admin"
issuer = "https://localhost/t/admin"
username = "admin"
password_env = "ASTERIUS_ADMIN_PASSWORD"
