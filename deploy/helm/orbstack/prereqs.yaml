# Everything the Asterius chart deliberately does not own, for a local
# OrbStack cluster: the database, the TLS certificate, the Traefik middlewares
# and the HTTP→HTTPS redirect. Development only.
#
#   kubectl apply -f deploy/helm/orbstack/prereqs.yaml
#
# Requires cert-manager and the CloudNativePG operator, both of which OrbStack
# does not install for you.
---
apiVersion: v1
kind: Namespace
metadata:
  name: asterius
---
# The chart has no subchart and no operator on purpose: a database an
# application chart brought up is a database nobody backs up. One instance and
# 1Gi is a development database, and it is not backed up either.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: asterius-db
  namespace: asterius
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: asterius
      owner: asterius
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
  namespace: asterius
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: asterius-tls
  namespace: asterius
spec:
  secretName: asterius-tls
  commonName: auth.k8s.orb.local
  dnsNames:
    - auth.k8s.orb.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: Issuer
---
# A client-supplied Forwarded or X-Client-Cert must never survive the proxy:
# the trust check inside Asterius is on the peer, not on who wrote the header.
# docs/deployment/tls-and-proxy.md §4 and §11.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: asterius-headers
  namespace: asterius
spec:
  headers:
    customRequestHeaders:
      Forwarded: ""
      X-Client-Cert: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: asterius-https-redirect
  namespace: asterius
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# The chart's Ingress binds websecure only. This one answers on :80 and
# redirects, so that an http:// URL typed by hand does not simply hang.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: asterius-http-redirect
  namespace: asterius
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: asterius-asterius-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: auth.k8s.orb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: asterius
                port:
                  number: 9443
