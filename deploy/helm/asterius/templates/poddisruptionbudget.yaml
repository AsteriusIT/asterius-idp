{{- if .Values.podDisruptionBudget.enabled }}
{{/*
A PDB over a single replica does not protect availability — it only refuses
node drains — so this is off by default and belongs with replicaCount > 1.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "asterius.fullname" . }}
  labels:
    {{- include "asterius.labels" . | nindent 4 }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "asterius.selectorLabels" . | nindent 6 }}
{{- end }}
