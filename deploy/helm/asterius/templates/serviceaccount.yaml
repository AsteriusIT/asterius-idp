{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "asterius.serviceAccountName" . }}
  labels:
    {{- include "asterius.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
Asterius never calls the Kubernetes API, so a projected token in the pod is a
credential with no use and one more thing an attacker who reaches the
filesystem finds.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
