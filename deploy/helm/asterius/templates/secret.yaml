{{- if include "asterius.createsSecret" . }}
{{/*
Only the values written into `values.yaml` land here. The production shape is
`existingSecret`: material that reaches a cluster through a chart's values also
reaches the release history, `helm get values`, and whatever CI printed on the
way. This exists so that a test cluster is one command, and says so.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "asterius.secretName" . }}
  labels:
    {{- include "asterius.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.secrets.kek.value (not .Values.secrets.kek.existingSecret) }}
  kek: {{ .Values.secrets.kek.value | quote }}
  {{- end }}
  {{- if and .Values.secrets.kekPrevious.value (not .Values.secrets.kekPrevious.existingSecret) }}
  kek-previous: {{ .Values.secrets.kekPrevious.value | quote }}
  {{- end }}
  {{- if and .Values.secrets.adminPassword.value (not .Values.secrets.adminPassword.existingSecret) }}
  admin-password: {{ .Values.secrets.adminPassword.value | quote }}
  {{- end }}
  {{- if and .Values.secrets.dpopNonceSecret.value (not .Values.secrets.dpopNonceSecret.existingSecret) }}
  dpop-nonce-secret: {{ .Values.secrets.dpopNonceSecret.value | quote }}
  {{- end }}
  {{- if and .Values.database.urlSecret.value (not .Values.database.urlSecret.existingSecret) }}
  database-url: {{ .Values.database.urlSecret.value | quote }}
  {{- end }}
{{- end }}
