[package]
name = "asterius-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Not a workspace member: cargo-fuzz builds with its own flags and a nightly
# toolchain, and dragging that into the main workspace would slow every
# ordinary build down.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `derive(Arbitrary)`, so a target can take a structured input rather than
# spending its budget teaching a byte string to be JSON.
arbitrary = { version = "1", features = ["derive"] }
asterius-admin-api = { path = "../crates/admin-api" }
asterius-domain = { path = "../crates/domain" }
asterius-jose = { path = "../crates/jose" }
asterius-oidc = { path = "../crates/oidc" }
asterius-server = { path = "../crates/server" }
asterius-ssf = { path = "../crates/ssf" }
asterius-web = { path = "../crates/web" }
asterius-webauthn = { path = "../crates/webauthn" }
# Needed by the targets themselves: `audit_canonical` builds events with
# timestamps, `forwarded_resolve` builds header maps, `client_metadata_json`
# rebuilds a registration document from what the validator accepted.
axum = { version = "0.8", default-features = false }
serde_json = "1"
time = "0.3"
# `pkce` recomputes RFC 7636 §4.2's transformation from primitives, so that the
# oracle and the code under test cannot share a mistake.
sha2 = "0.10"
# `theme_image` recomputes the digest of what the adapter stored, so that the
# oracle and the code under test do not share a hasher call.
hex = "0.4"
base64 = "0.22"
# `pairwise_subject` builds local account identifiers by hand so that a case is
# reproducible from its corpus entry.
uuid = "1"
# `grant_record` re-parses every resource indicator the grant validator
# accepted, so that "absolute URI, no fragment" is checked by something other
# than the code under test.
url = "2"
# `client_certificate_header` states its property in terms of a trusted-proxy
# set, which is the whole point of that target.
ipnet = "2"

