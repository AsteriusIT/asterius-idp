{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "policies.identity.asterius.io"
  },
  "spec": {
    "group": "identity.asterius.io",
    "scope": "Namespaced",
    "names": {
      "kind": "Policy",
      "plural": "policies",
      "singular": "policy"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "properties": {
              "apiVersion": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              "kind": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "tenantRef": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 63,
                    "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
                    "enum": [
                      "default"
                    ],
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "field is immutable; create a new incarnation"
                      }
                    ]
                  },
                  "deletionPolicy": {
                    "type": "string",
                    "enum": [
                      "Retain",
                      "Delete"
                    ],
                    "default": "Retain"
                  },
                  "deletionProtection": {
                    "type": "boolean",
                    "default": true
                  },
                  "importId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048,
                    "pattern": "^[A-Za-z0-9_-]+$",
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "field is immutable; create a new incarnation"
                      }
                    ]
                  },
                  "adoptionPolicy": {
                    "type": "string",
                    "enum": [
                      "Never",
                      "AdoptUnowned"
                    ],
                    "default": "Never"
                  },
                  "rulesJson": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 65536,
                    "description": "Exact existing RuleSet version 1 JSON; parsed by Asterius validators before apply."
                  }
                },
                "required": [
                  "tenantRef",
                  "rulesJson"
                ],
                "x-kubernetes-validations": [
                  {
                    "rule": "has(oldSelf.importId) == has(self.importId)",
                    "message": "import identity is immutable"
                  }
                ]
              },
              "status": {
                "type": "object",
                "properties": {
                  "observedGeneration": {
                    "type": "integer",
                    "format": "int64",
                    "minimum": 0
                  },
                  "observedDeletionProtection": {
                    "type": "boolean"
                  },
                  "remoteId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048
                  },
                  "remoteRevision": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 64,
                    "pattern": "^[0-9a-f]{64}$"
                  },
                  "conditions": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "type": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 64
                        },
                        "status": {
                          "type": "string",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ]
                        },
                        "reason": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 64
                        },
                        "message": {
                          "type": "string",
                          "maxLength": 256
                        },
                        "observedGeneration": {
                          "type": "integer",
                          "format": "int64",
                          "minimum": 0
                        },
                        "lastTransitionTime": {
                          "type": "string",
                          "format": "date-time"
                        }
                      },
                      "required": [
                        "type",
                        "status",
                        "reason",
                        "message",
                        "observedGeneration",
                        "lastTransitionTime"
                      ]
                    },
                    "maxItems": 8,
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "type"
                    ]
                  }
                },
                "required": []
              }
            },
            "required": [
              "spec"
            ]
          }
        },
        "additionalPrinterColumns": [
          {
            "name": "Ready",
            "type": "string",
            "jsonPath": ".status.conditions[?(@.type==\"Ready\")].status"
          },
          {
            "name": "Generation",
            "type": "integer",
            "jsonPath": ".status.observedGeneration"
          }
        ]
      }
    ]
  }
}
