{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "asteriustenantbindings.identity.asterius.io"
  },
  "spec": {
    "group": "identity.asterius.io",
    "scope": "Namespaced",
    "names": {
      "kind": "AsteriusTenantBinding",
      "plural": "asteriustenantbindings",
      "singular": "asteriustenantbinding"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "properties": {
              "apiVersion": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              "kind": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "tenantId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 128,
                    "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]*$",
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "field is immutable; create a new incarnation"
                      }
                    ]
                  },
                  "issuer": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048,
                    "pattern": "^https://[^/?# @]+([/?][^# ]*)?$",
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "field is immutable; create a new incarnation"
                      }
                    ]
                  },
                  "clientId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 512,
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "field is immutable; create a new incarnation"
                      }
                    ]
                  },
                  "authenticationKeySecretRef": {
                    "type": "object",
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63,
                        "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                      },
                      "key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 128,
                        "pattern": "^[A-Za-z0-9._-]+$"
                      }
                    },
                    "required": [
                      "name",
                      "key"
                    ]
                  },
                  "dpopKeySecretRef": {
                    "type": "object",
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63,
                        "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                      },
                      "key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 128,
                        "pattern": "^[A-Za-z0-9._-]+$"
                      }
                    },
                    "required": [
                      "name",
                      "key"
                    ]
                  },
                  "issuerCaSecretRef": {
                    "type": "object",
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 63,
                        "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                      },
                      "key": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 128,
                        "pattern": "^[A-Za-z0-9._-]+$"
                      }
                    },
                    "required": [
                      "name",
                      "key"
                    ]
                  },
                  "clusterId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 63,
                    "pattern": "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
                    "x-kubernetes-validations": [
                      {
                        "rule": "self == oldSelf",
                        "message": "field is immutable; create a new incarnation"
                      }
                    ]
                  }
                },
                "required": [
                  "tenantId",
                  "issuer",
                  "clientId",
                  "authenticationKeySecretRef",
                  "dpopKeySecretRef",
                  "clusterId"
                ],
                "x-kubernetes-validations": [
                  {
                    "rule": "self.authenticationKeySecretRef.name == oldSelf.authenticationKeySecretRef.name && self.dpopKeySecretRef.name == oldSelf.dpopKeySecretRef.name",
                    "message": "credential Secret names are immutable; rotate their content"
                  }
                ]
              },
              "status": {
                "type": "object",
                "properties": {
                  "observedGeneration": {
                    "type": "integer",
                    "format": "int64",
                    "minimum": 0
                  },
                  "observedDeletionProtection": {
                    "type": "boolean"
                  },
                  "remoteId": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 2048
                  },
                  "remoteRevision": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 64,
                    "pattern": "^[0-9a-f]{64}$"
                  },
                  "conditions": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "type": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 64
                        },
                        "status": {
                          "type": "string",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ]
                        },
                        "reason": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 64
                        },
                        "message": {
                          "type": "string",
                          "maxLength": 256
                        },
                        "observedGeneration": {
                          "type": "integer",
                          "format": "int64",
                          "minimum": 0
                        },
                        "lastTransitionTime": {
                          "type": "string",
                          "format": "date-time"
                        }
                      },
                      "required": [
                        "type",
                        "status",
                        "reason",
                        "message",
                        "observedGeneration",
                        "lastTransitionTime"
                      ]
                    },
                    "maxItems": 8,
                    "x-kubernetes-list-type": "map",
                    "x-kubernetes-list-map-keys": [
                      "type"
                    ]
                  }
                },
                "required": []
              }
            },
            "required": [
              "spec"
            ]
          }
        },
        "additionalPrinterColumns": [
          {
            "name": "Ready",
            "type": "string",
            "jsonPath": ".status.conditions[?(@.type==\"Ready\")].status"
          },
          {
            "name": "Generation",
            "type": "integer",
            "jsonPath": ".status.observedGeneration"
          }
        ]
      }
    ]
  }
}
