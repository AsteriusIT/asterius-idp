{{- if not .Values.secretNames }}
{{- fail "secretNames must explicitly select at least one Secret" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: asterius-controller}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: asterius-controller}
rules:
  - apiGroups: [identity.asterius.io]
    resources: [applications, resources, policies]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [identity.asterius.io]
    resources: [applications/status, resources/status, policies/status]
    verbs: [get, patch, update]
  - apiGroups: [identity.asterius.io]
    resources: [asteriustenantbindings]
    resourceNames: [default]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ toJson .Values.secretNames }}
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [asterius-controller]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: asterius-controller}
subjects:
  - {kind: ServiceAccount, name: asterius-controller, namespace: {{ .Release.Namespace | quote }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: asterius-controller}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata: {name: asterius-controller}
spec: {leaseDurationSeconds: 30}
{{- if .Values.gitopsGroup }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: asterius-gitops}
rules:
  - apiGroups: [identity.asterius.io]
    resources: [applications, resources, policies]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [identity.asterius.io]
    resources: [asteriustenantbindings]
    resourceNames: [default]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: asterius-gitops}
subjects:
  - {kind: Group, name: {{ .Values.gitopsGroup | quote }}, apiGroup: rbac.authorization.k8s.io}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: asterius-gitops}
{{- end }}
