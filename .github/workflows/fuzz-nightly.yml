name: Nightly fuzzing

# Sixty seconds per target on a PR catches regressions. Finding something new
# takes longer than anyone will wait for a pull request, so the real runs happen
# here, and the corpus is carried between runs so each night starts where the
# last one stopped rather than from nothing.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - issuer_parse
          - tenant_route
          - config_parse
          - redaction_scan
          - forwarded_resolve
          - audit_canonical
          - jws_parse
          - client_metadata_json
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: fuzz for ten minutes
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600 -print_final_stats=1

      - name: save the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: upload any crash that was found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
