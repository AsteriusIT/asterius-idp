name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# One group per pull request, per merge-queue entry and per branch, so a run
# never cancels an unrelated one, and cancelling at all is restricted to pull
# requests.
#
# `github.ref` alone was almost enough — it already separates a PR from `main`
# — but every push to `main` shares `refs/heads/main`, so two merges landed a
# few minutes apart cancelled each other and the first commit never got a
# verdict. That is exactly the hole `ast-a33` closes: branches are merged
# locally with `--no-ff` and pushed (CONTRIBUTING, "How a branch reaches
# `main`"), which makes back-to-back pushes to `main` the normal case, not the
# exception. On `main` and in the merge queue runs now queue instead: slower,
# but every commit is tested. On a pull request an outdated run of a superseded
# commit is genuinely worthless, so there it still cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a warning anywhere, and keep incremental artefacts out of the
  # cache: they are large and never reused across runners.
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------------
  # Cheap, parallel checks. These fail in under two minutes and catch most PRs.
  # -------------------------------------------------------------------------
  lint:
    name: fmt, clippy, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The fuzz crate is its own workspace with its own target directory, and
      # the `fuzz coverage` step below compiles it. Cache both, or that step
      # rebuilds the dependency tree from cold on every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"

      - name: cargo fmt
        run: cargo fmt --all --check

      # Offline: clippy must not need a database. The committed .sqlx data is
      # what makes that possible, and `sqlx-check` below proves it is current.
      #
      # `--keep-going` so a lint failure in one crate does not cancel the
      # crates that were still to be checked (`ast-j51`): with -D warnings the
      # first denied lint ends the build, and the rest of the workspace is
      # only ever seen one push later.
      - name: cargo clippy
        env:
          SQLX_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --all-features --keep-going -- -D warnings

      # ADR-0001: protocol crates must not reach sqlx, axum, tokio, hyper,
      # reqwest or askama, directly or transitively. Also asserts
      # #![forbid(unsafe_code)] on every crate root.
      - name: ports-and-adapters layering
        run: ./scripts/check-layering.sh

      # Definition of done: every parser and validator has a fuzz target — and
      # one that still compiles. The fuzz crate is outside the workspace, so
      # this step is the only thing in the pipeline that type-checks it before
      # the nightly fuzzing job does, hours later.
      #
      # For the same reason it also runs rustfmt and clippy over `fuzz/`: the
      # two steps above are workspace-wide and stop at the workspace boundary,
      # which is how 24 targets came to be unformatted. Inside this script
      # rather than as steps here, so `./scripts/check.sh` catches the drift
      # locally instead of on a runner, and inside this job rather than a new
      # one, which would be a whole runner for a few seconds of work.
      - name: fuzz coverage, formatting and lints
        run: ./scripts/check-fuzz-coverage.sh

      # Belt and braces around the forbid attribute: an `unsafe` block that
      # somehow compiles should still stop the build. A script rather than an
      # inline grep so that `./scripts/check.sh` runs the same check locally —
      # this one lived only in CI, which is why a false positive in it was not
      # caught before the push.
      - name: no unsafe in first-party code
        run: ./scripts/check-no-unsafe.sh

  # -------------------------------------------------------------------------
  # Tests, against a real PostgreSQL. The database tests are the ones that
  # prove tenant isolation, so they are not optional in CI even though they
  # are optional locally.
  # -------------------------------------------------------------------------
  test:
    name: tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asterius
          POSTGRES_PASSWORD: asterius
          POSTGRES_DB: asterius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterius -d asterius"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://asterius:asterius@localhost:5432/asterius
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,sqlx-cli@0.8.6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      # Before cargo, because `crates/admin-api/build.rs` embeds `console/dist`
      # at compile time and this job never built it (`ast-rna`, absorbing
      # `ast-k3x`). The tests that serve the console were therefore running
      # against an empty asset table — passing while checking nothing. The
      # bundle is now built here, and
      # `admin_api::console::tests::the_embedded_bundle_names_no_third_party_origin_it_could_fetch`
      # fails under `CI` if it is empty, so the two cannot drift apart again.
      - name: build the console bundle
        run: ./scripts/build-console.sh

      # Acceptance for ast-83p.3: migrations apply to an empty database and are
      # idempotent on a second run.
      - name: migrations apply to a fresh database
        run: |
          cd crates/store-pg
          sqlx migrate run
          sqlx migrate run
          sqlx migrate info

      # `--no-fail-fast`, and the same reason as the fuzz matrix below
      # (`ast-j51`): nextest stops the run at the first failing test by
      # default, so a red push reports one failure and hides the rest. On
      # `main` 72eb594 this job showed one; `--no-fail-fast` locally showed
      # five, three of them in crates the run never reached. Each hidden
      # failure costs a full CI round trip to discover.
      - name: cargo test
        run: cargo nextest run --workspace --all-features --no-fail-fast

      # Same reason: `cargo test` aborts after the first failing doctest
      # binary otherwise.
      - name: doctests
        run: cargo test --workspace --doc --no-fail-fast

  # -------------------------------------------------------------------------
  # The committed .sqlx data must match the queries in the tree, or an offline
  # build (which is what every other job does) silently checks stale SQL.
  # -------------------------------------------------------------------------
  sqlx-check:
    name: sqlx offline data is current
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asterius
          POSTGRES_PASSWORD: asterius
          POSTGRES_DB: asterius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterius -d asterius"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://asterius:asterius@localhost:5432/asterius
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6
      - name: apply migrations
        run: cd crates/store-pg && sqlx migrate run
      - name: cargo sqlx prepare --check
        run: cargo sqlx prepare --check --workspace -- --all-targets

  # -------------------------------------------------------------------------
  # A JSONB member named `$serde_json::private::...` makes its row unreadable
  # by every binary here (`raw_value` is on workspace-wide). `json_sentinel.rs`
  # stops new ones being written; this job proves the schema a migration
  # produces carries none, and that the reserved names listed in the SQL still
  # match the Rust list.
  #
  # Its own PostgreSQL service, and no test runs against it: `ast-9g2` seeds a
  # row carrying a sentinel on purpose inside an isolated database test, and
  # sharing a database with the test job would turn that fixture into a
  # finding. Migrated and scanned, nothing else.
  # -------------------------------------------------------------------------
  json-sentinels:
    name: no serde_json sentinel in JSONB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asterius
          POSTGRES_PASSWORD: asterius
          POSTGRES_DB: asterius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterius -d asterius"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://asterius:asterius@localhost:5432/asterius
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.8.6

      # The script applies whatever migrations the tree has; it never lists
      # them, so a new one is covered the day it lands.
      - name: apply migrations
        run: cd crates/store-pg && sqlx migrate run

      # Exit 1 means findings, exit 2 means the check could not run (no psql,
      # no database, or the sentinel lists in the SQL drifted from the Rust
      # one). Both are failures, which is what an unguarded `run` gives.
      - name: scan every JSONB column
        run: ./scripts/check-json-sentinels.sh

  # -------------------------------------------------------------------------
  # Supply chain. Advisories move without us touching the tree, so this also
  # runs on a schedule in audit.yml.
  # -------------------------------------------------------------------------
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # advisories, bans, licenses and sources, per deny.toml.
      - run: cargo deny check

  # -------------------------------------------------------------------------
  # Documentation must build without warnings: the ADRs and the threat model
  # link into rustdoc, and a broken intra-doc link means a stale reference.
  # -------------------------------------------------------------------------
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--keep-going`: cargo stops documenting at the first crate that
      # errors, so `-D warnings` turns one broken intra-doc link into a
      # report that hides every other one. `ast-cts` saw 2 reported and 11
      # actual. Documenting the whole workspace before concluding costs
      # nothing when the job is green.
      - run: cargo doc --workspace --no-deps --all-features --keep-going

  # -------------------------------------------------------------------------
  # The jobs that run a browser (`ast-2vk.14`, split by project in `ast-rna`).
  #
  # Everything else in this pipeline asserts what the source says. These assert
  # what Chromium does with it: that login and consent work with JavaScript
  # disabled, that the browser keeps the `__Host-` cookie we write — the
  # prefix's guarantees are browser-enforced, so nothing else can check them —
  # and that no page provokes a Content-Security-Policy violation, in the no-JS
  # suite and in the JS one. `e2e/tests/csp-gate.spec.ts` breaks a page on
  # purpose and asserts the gate refuses it, so a green run here is not a
  # browser that has stopped reporting.
  #
  # One leg per Playwright project, and not for speed. The `js` leg is where
  # the admin console lives — `console.spec.ts`, `key-rotation.spec.ts` and the
  # axe sweep over every page a route really renders — and it can only run with
  # script enabled. Naming it means a red console reports as a console failure
  # rather than as one line inside a sweep about the no-JS flow, and it is the
  # job `ast-rna` exists to add: those specs were green and nothing replayed
  # them.
  #
  # `fail-fast: false`, for the reason the fuzz matrix records: one red leg
  # must not hide another.
  #
  # Kept short deliberately (`ast-83p.15`): one browser rather than three, a
  # debug build off the shared cache rather than a container image, and the flow
  # runs in one project rather than both. It is nowhere near the critical path.
  # -------------------------------------------------------------------------
  browser:
    name: browser sweep (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [no-js, js]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asterius
          POSTGRES_PASSWORD: asterius
          POSTGRES_DB: asterius
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U asterius -d asterius"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://asterius:asterius@127.0.0.1:5433/asterius
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # Two lockfiles: the sweep's own, and the console's — which
          # `scripts/browser-tests.sh` builds before cargo, because the bundle
          # is embedded in the binary under test (`ast-f7m.3`).
          cache-dependency-path: |
            e2e/package-lock.json
            console/package-lock.json

      # Cached across runs and keyed on the lockfile: the browser is ~150 MB and
      # changes only when @playwright/test does.
      - name: cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # The script starts the server, issues its certificate and seeds the
      # fixtures. Running it here rather than reimplementing the steps is the
      # point: what CI runs and what a developer runs are the same file.
      - name: browser sweep
        run: ./scripts/browser-tests.sh --project=${{ matrix.project }}

      - name: upload the traces of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # A short fuzz run on every PR. Sixty seconds per target does not prove much
  # on its own — the value is that a change which makes a parser panic on its
  # own seed corpus fails here rather than at 3am. The long runs are nightly,
  # in fuzz-nightly.yml.
  #
  # One job per target, for three reasons, all of them learned the hard way.
  #
  # It used to be a `for` loop, and at 31 targets it took 35 minutes while no
  # other job took more than three — the pipeline *was* this job. The loop also
  # grew by a minute for every parser added, and `check-fuzz-coverage.sh`
  # requires a target per parser, so that growth was structural rather than
  # something to keep an eye on.
  #
  # Worse, a loop stops at the first failure. When `access_token_claims` broke,
  # `csp_form_action` and `id_token_claims` were never reached, and both turned
  # out to be broken too — for an unknown length of time, because nothing had
  # ever run them. `fail-fast: false` below is the fix for that: every target
  # reports, so one red target cannot hide another.
  #
  # The targets are enumerated rather than listed, for the reason
  # fuzz-nightly.yml already records: a hand-maintained matrix goes stale.
  # -------------------------------------------------------------------------
  fuzz-targets:
    name: enumerate fuzz targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          # Only the names inside a [[bin]] block. A bare grep for `name = `
          # would also pick up [package].name. Read from Cargo.toml rather than
          # `cargo fuzz list` so this job needs no toolchain and no build.
          targets=$(awk '/^\[\[bin\]\]/ { in_bin = 1; next }
                         in_bin && /^name = / { gsub(/^name = "|"$/, ""); print; in_bin = 0 }' \
                    fuzz/Cargo.toml | jq -R . | jq -sc .)
          echo "matrix=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-targets
    runs-on: ubuntu-latest
    strategy:
      # Never stop at the first failure: see above.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Read-only, and shared with fuzz-nightly.yml's key. A minute against a
      # corpus the night before spent ten minutes building is worth much more
      # than a minute from nothing: the interesting inputs are replayed first,
      # so a change that breaks one of them fails here immediately. Nothing is
      # saved back — a 60 s run has nothing to add, and writing would race the
      # nightly job that does.
      - name: restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The target is pinned. AddressSanitizer cannot work against a
      # statically linked libc — "sanitizer is incompatible with statically
      # linked libc" — so if anything in the environment defaults the build to
      # a musl triple (a CARGO_BUILD_TARGET inherited from the runner, say),
      # every fuzz job fails before it starts. Naming the gnu triple here makes
      # the job independent of what the runner happens to be configured for.
      - name: fuzz for 60 s
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            -- -max_total_time=60 -print_final_stats=1

      - name: upload any crash that was found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # A single required status check, so branch protection does not have to be
  # edited every time a job is added.
  ci:
    name: CI
    if: always()
    needs:
      [
        lint,
        test,
        sqlx-check,
        json-sentinels,
        supply-chain,
        docs,
        browser,
        fuzz-targets,
        fuzz,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if grep -qE '"result": *"(failure|cancelled|skipped)"' <<<"$results"; then
            echo "::error::at least one CI job did not succeed"
            exit 1
          fi
