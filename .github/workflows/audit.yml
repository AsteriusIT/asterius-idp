name: Supply chain audit

# Advisories are published against dependencies we are not touching, so the
# tree can go from clean to vulnerable with no commit of ours in between.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"

permissions:
  contents: read
  issues: write

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources
