name: Supply chain audit

# Advisories are published against dependencies we are not touching, so the
# tree can go from clean to vulnerable with no commit of ours in between.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"

permissions:
  contents: read
  issues: write

jobs:
  # cargo-deny and not cargo-audit, and not both.
  #
  # They read the same database — RustSec's advisory-db — and `cargo deny check
  # advisories` is a superset of what `cargo audit` reports: the same
  # advisories, plus unmaintained and yanked crates, plus the bans, licence and
  # source policies in deny.toml, from one lockfile pass. Running both would
  # mean a second runner, a second tool to keep installed and a second place to
  # write an exception for the same finding — cost without signal. If cargo-deny
  # ever stops tracking advisory-db, this is the comment to come back to.
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  # -------------------------------------------------------------------------
  # The definition of done asks for zero `unsafe` expressions in first-party
  # crates, counted rather than grepped. `scripts/check-geiger.sh` says why
  # this lives here and not in ci.yml: geiger is minutes rather than seconds,
  # and what it measures changes with `Cargo.lock`, which is one of the paths
  # that triggers this workflow. Every commit is still covered by
  # `#![forbid(unsafe_code)]` and by `check-no-unsafe.sh` in the `lint` job.
  # -------------------------------------------------------------------------
  geiger:
    name: cargo-geiger (no unsafe in first-party crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned, and the pin is load-bearing for a gate that parses a table:
      # install-action has no manifest for cargo-geiger and falls back to
      # cargo-binstall, which resolves `latest` at run time — so an upstream
      # release could change the report format under us on a day nobody
      # touched this repository, and the failure would look like the one
      # `ast-yxu` chased. 0.13.0 is the version whose output
      # `scripts/check-geiger.sh` is written against and was verified with.
      # Bump deliberately, and re-read the parsing comments when you do.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger@0.13.0
      - run: ./scripts/check-geiger.sh
